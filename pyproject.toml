[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "file-delete-mcp"
version = "0.1.0"
description = "Ticket-gated MCP server that moves workspace files into .del and purges them on demand."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["mcp==1.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
file-delete-mcp = "file_delete_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/file_delete_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
